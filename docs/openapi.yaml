  /api/v1/mentor/mentees/{studentId}/confirmed:
    patch:
      tags: [Mentor]
      summary: Confirm a mentee request
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/studentId"
      responses:
        "200": { description: Mentee confirmed. }
  /api/v1/mentor/mentees/{studentId}/cancelled:
    patch:
      tags: [Mentor]
      summary: Cancel a mentee request
      security: [{ bearerAuth: [] }]
      parameters:
