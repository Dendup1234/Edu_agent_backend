        $ref: "#/components/requestBodies/ChecklistCreate"
      responses:
        "201": { description: Checklist created. }
    get:
      tags: [Agent]
      summary: Get a student's document checklist
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/checklistTargetId"
        - $ref: "#/components/parameters/stage"
      responses:
        "200": { description: Checklist. }
    delete:
      tags: [Agent]
      summary: Remove one document from a student's checklist
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/checklistTargetId"
      responses:
        "200": { description: Checklist item removed. }
  /api/v1/agent/documents/review/{studentRequiredDocumentId}:
