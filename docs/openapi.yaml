    get:
      tags: [Agency Employees]
      summary: Search agency mentors by name
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/name"
      responses:
        "200": { description: Matching mentors. }
  /api/v1/agency/mentors/dashboard/stats:
    get:
      tags: [Agency Employees]
      summary: Get agency mentor dashboard metrics
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Mentor dashboard. }
  /api/v1/agency/documents/{studentId}:
    get:
      tags: [Agency]
      summary: Get documents for a student
      parameters:
        - $ref: "#/components/parameters/studentId"
      responses:
        "200": { description: Student documents. }

  /api/v1/agency/students/{studentId}/assignment/auto-trigger:
    post:
      tags: [Internal Automation]
      summary: Trigger auto-assignment workflow for a student
      parameters:
        - $ref: "#/components/parameters/studentId"
      requestBody:
        $ref: "#/components/requestBodies/AutoAssignmentTrigger"
      responses:
        "200": { description: Workflow triggered. }
  /api/v1/agency/internal/assignment/student/{studentId}:
    get:
      tags: [Internal Automation]
      summary: Get student context for assignment automation
      security: [{ internalToken: [] }]
      parameters:
        - $ref: "#/components/parameters/studentId"
      responses:
        "200": { description: Student assignment context. }
  /api/v1/agency/internal/assignment/candidates:
    get:
      tags: [Internal Automation]
      summary: Get candidate agents for assignment automation
      security: [{ internalToken: [] }]
      parameters:
        - $ref: "#/components/parameters/agencyIdQuery"
        - name: role
          in: query
          schema: { type: string }
      responses:
        "200": { description: Candidate agents. }
  /api/v1/agency/internal/assignment/assign:
    post:
      tags: [Internal Automation]
      summary: Save an assignment selected by automation
      security: [{ internalToken: [] }]
      requestBody:
        $ref: "#/components/requestBodies/AutoAssignmentSave"
      responses:
        "200": { description: Assignment saved. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: x-internal-token
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
    agencyId: { name: agencyId, in: path, required: true, schema: { type: string } }
    agencyIdQuery: { name: agencyId, in: query, schema: { type: string } }
    agentId: { name: agentId, in: path, required: true, schema: { type: string } }
    appointmentId: { name: appointmentId, in: path, required: true, schema: { type: string } }
    checklistTargetId:
      name: checklistTargetId
      in: path
      required: true
      description: Student ID for POST/GET checklist operations; studentRequiredDocumentId for DELETE.
      schema: { type: string }
    courseId: { name: courseId, in: path, required: true, schema: { type: string } }
    eventId: { name: eventId, in: path, required: true, schema: { type: string } }
    mentorId: { name: mentorId, in: path, required: true, schema: { type: string } }
    roleId: { name: roleId, in: path, required: true, schema: { type: string } }
    scholarshipId: { name: scholarshipId, in: path, required: true, schema: { type: string } }
    seatId: { name: seatId, in: path, required: true, schema: { type: string } }
    studentId: { name: studentId, in: path, required: true, schema: { type: string } }
    studentRequiredDocumentId: { name: studentRequiredDocumentId, in: path, required: true, schema: { type: string } }
    ticketId: { name: ticketId, in: path, required: true, schema: { type: string } }
    universityId: { name: universityId, in: path, required: true, schema: { type: string } }
    q: { name: q, in: query, schema: { type: string } }
    name: { name: name, in: query, schema: { type: string } }
    stage: { name: stage, in: query, schema: { type: string } }
    cursorCreatedAt: { name: cursorCreatedAt, in: query, schema: { type: string, format: date-time } }
    cursorId: { name: cursorId, in: query, schema: { type: string } }
    limit: { name: limit, in: query, schema: { type: integer, default: 10 } }
  requestBodies:
    AnyObject:
      required: false
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    Email:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
    EmailOtp:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, otp]
            properties:
              email: { type: string, format: email }
              otp: { type: string, example: "1234" }
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email }
              password: { type: string, format: password }
    NewPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [resetToken, newPassword]
            properties:
              resetToken: { type: string }
              newPassword: { type: string, format: password }
    GoogleAuth:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [id_token]
            properties:
              id_token: { type: string }
    Chat:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
              mode: { type: string }
    StudentSignup:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, email, password]
            properties:
              name: { type: string }
              phone: { type: string }
              email: { type: string, format: email }
              password: { type: string, format: password }
    AgencySignup:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, organizationName, email, password]
            properties:
              name: { type: string }
              phone: { type: string }
              organizationName: { type: string }
              email: { type: string, format: email }
              password: { type: string, format: password }
    AdminCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, email, phone]
            properties:
              name: { type: string }
              email: { type: string, format: email }
              phone: { type: string }
    AgencySelection:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [agencyId]
            properties:
              agencyId: { type: string }
    PushToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [pushToken]
            properties:
              pushToken: { type: string }
    TestNotification:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              studentId: { type: string }
              triggerId: { type: string }
              title: { type: string }
              body: { type: string }
    SasRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [mimeType, size]
            properties:
              mimeType: { type: string, example: image/png }
              size: { type: integer, description: File size in bytes. }
    BlobConfirm:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              blobName: { type: string }
              imageType: { type: string }
    StudentUploadConfirm:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              blobName: { type: string }
              imageType: { type: string }
              documentId: { type: string }
              requiredDocumentId: { type: string }
    AgentUploadConfirm:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              blobName: { type: string }
              imageType: { type: string }
    AgencyUploadConfirm:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              blobName: { type: string }
              universityId: { type: string }
              eventId: { type: string }
              imageType: { type: string }
    EventRegistration:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              seatIds:
                type: array
                items: { type: string }
    Appointment:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [studentId, time, date]
            properties:
              studentId: { type: string }
              time: { type: string }
              date: { type: string, format: date }
              meeting: { type: string }
              purpose: { type: string }
    RequiredDocument:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, stage]
            properties:
              name: { type: string }
              description: { type: string }
              stage: { type: string }
    RequiredDocumentUpdate:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
    ChecklistCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [requiredDocumentIds]
            properties:
              requiredDocumentIds:
                type: array
                items: { type: string }
    DocumentReview:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string }
              reviewComment: { type: string }
    FraudResult:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              fraudStatus: { type: string }
              confidence: { type: number }
              reason: { type: string }
    University:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              name: { type: string }
              country: { type: string }
              city: { type: string }
              description: { type: string }
    Course:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              name: { type: string }
              duration: { type: string }
              tuitionFee: { type: number }
              description: { type: string }
    Event:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              name: { type: string }
              description: { type: string }
              date: { type: string, format: date }
              location: { type: string }
    TicketType:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, price]
            properties:
              name: { type: string }
              description: { type: string }
              price: { type: number }
    EventSeats:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [seats]
            properties:
              seats:
                type: array
                items: { type: object, additionalProperties: true }
    SeatUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ticketTypeId]
            properties:
              ticketTypeId: { type: string }
    Scholarship:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              name: { type: string }
              description: { type: string }
              amount: { type: number }
              eligibility: { type: string }
    AgentCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, email, phone, systemRole]
            properties:
              name: { type: string }
              email: { type: string, format: email }
              phone: { type: string }
              systemRole: { type: string }
              roleId: { type: string }
    MentorCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, email, phone]
            properties:
              name: { type: string }
              email: { type: string, format: email }
              phone: { type: string }
    Role:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, permissions]
            properties:
              name: { type: string }
              permissions:
                type: array
                items: { type: string }
    AgentAssignment:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [agentId]
            properties:
              agentId: { type: string }
    AutoAssignmentTrigger:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              role: { type: string }
    AutoAssignmentSave:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [studentId, agentId, role]
            properties:
              studentId: { type: string }
              agentId: { type: string }
              role: { type: string }
              reason: { type: string }
