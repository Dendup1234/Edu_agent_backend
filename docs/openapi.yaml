      summary: Get assigned student count for current agent
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Student count. }
  /api/v1/agent/student-required-documents/{studentRequiredDocumentId}/fraud-context:
    get:
      tags: [Internal Automation]
      summary: Get document fraud-check context
      security: [{ internalToken: [] }]
      parameters:
        - $ref: "#/components/parameters/studentRequiredDocumentId"
      responses:
        "200": { description: Fraud-check context. }
  /api/v1/agent/student-required-documents/{studentRequiredDocumentId}/fraud-result:
    patch:
      tags: [Internal Automation]
      summary: Save document fraud-check result
      security: [{ internalToken: [] }]
      parameters:
        - $ref: "#/components/parameters/studentRequiredDocumentId"
      requestBody:
