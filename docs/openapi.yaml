      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/Appointment"
      responses:
        "201": { description: Appointment created. }
    get:
      tags: [Mentor]
      summary: List mentor appointments
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Appointment list. }
  /api/v1/mentor/appointments/{appointmentId}/update:
    patch:
      tags: [Mentor]
      summary: Update a mentor appointment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/appointmentId"
      requestBody:
        $ref: "#/components/requestBodies/AnyObject"
      responses:
        "200": { description: Appointment updated. }
  /api/v1/mentor/appointments/{appointmentId}/cancel:
    patch:
      tags: [Mentor]
      summary: Cancel a mentor appointment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/appointmentId"
      responses:
        "200": { description: Appointment cancelled. }
  /api/v1/mentor/appointments/{appointmentId}/complete:
    patch:
      tags: [Mentor]
      summary: Mark a mentor appointment complete
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/appointmentId"
      responses:
        "200": { description: Appointment completed. }
  /api/v1/mentor/appointments/search:
    get:
      tags: [Mentor]
      summary: Search mentor appointments by student name
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/name"
      responses:
        "200": { description: Matching appointments. }
  /api/v1/mentor/students/{studentId}:
    get:
      tags: [Mentor]
      summary: Get a student's profile for a mentor
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/studentId"
      responses:
        "200": { description: Student profile. }
  /api/v1/mentor/uploads/sas:
    post:
      tags: [Mentor]
      summary: Generate mentor upload SAS details
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/SasRequest"
      responses:
        "200": { description: SAS upload details. }
  /api/v1/mentor/uploads/confirm:
    post:
      tags: [Mentor]
      summary: Confirm mentor profile upload
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/BlobConfirm"
      responses:
        "200": { description: Upload confirmed. }

  /api/v1/agent/login:
    post:
      tags: [Agent Auth]
      summary: Agent login
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200": { description: Login token and agent data. }
  /api/v1/agent/password-reset/send-otp:
    post:
      tags: [Agent Auth]
      summary: Send agent password reset OTP
      requestBody:
        $ref: "#/components/requestBodies/Email"
      responses:
