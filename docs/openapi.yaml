openapi: 3.0.3
info:
  title: Edu Agent Backend API
  version: 1.0.0
  description: Swagger/OpenAPI reference for the Edu Agent backend routes mounted in server.js.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Health
  - name: OAuth
  - name: Chat
  - name: Student Auth
  - name: Student
  - name: Mentor Auth
  - name: Mentor
  - name: Agent Auth
  - name: Agent
  - name: Admin Auth
  - name: Admin
  - name: Agency Auth
  - name: Agency
  - name: Agency Universities
  - name: Agency Courses
  - name: Agency Events
  - name: Agency Scholarships
  - name: Agency Employees
  - name: Internal Automation

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is available.

  /google-signin-agency:
    post:
      tags: [OAuth]
      summary: Sign in an agency user with Google ID token
      requestBody:
        $ref: "#/components/requestBodies/GoogleAuth"
      responses:
        "200": { description: Signed in successfully. }
  /google-signin-student:
    post:
      tags: [OAuth]
      summary: Sign in a student with Google ID token
      requestBody:
        $ref: "#/components/requestBodies/GoogleAuth"
      responses:
        "200": { description: Signed in successfully. }

  /google-signin-agent:
    post:
      tags: [OAuth]
      summary: Sign in an existing agent with Google ID token
      requestBody:
        $ref: "#/components/requestBodies/GoogleAuth"
      responses:
        "200": { description: Signed in successfully. }
        "404": { description: Agent not found for this email. }

  /api/v1/openai/chatbot:
    post:
      tags: [Chat]
      summary: Send a message to the chatbot stream
      requestBody:
        $ref: "#/components/requestBodies/Chat"
      responses:
        "200": { description: Chat response stream or payload. }

  /api/v1/students/send-otp:
    post:
      tags: [Student Auth]
      summary: Start student registration and send OTP
      requestBody:
        $ref: "#/components/requestBodies/StudentSignup"
      responses:
        "200": { description: OTP sent. }
  /api/v1/students/resend-otp:
    post:
      tags: [Student Auth]
      summary: Resend student registration OTP
      requestBody:
        $ref: "#/components/requestBodies/Email"
      responses:
        "200": { description: OTP resent. }
  /api/v1/students/verify-otp:
    post:
      tags: [Student Auth]
      summary: Verify student registration OTP
      requestBody:
        $ref: "#/components/requestBodies/EmailOtp"
      responses:
        "200": { description: Student registered. }
  /api/v1/students/login:
    post:
      tags: [Student Auth]
      summary: Student login
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200": { description: Login token and user data. }
  /api/v1/students/password-reset/send-otp:
    post:
      tags: [Student Auth]
      summary: Send student password reset OTP
      requestBody:
        $ref: "#/components/requestBodies/Email"
      responses:
        "200": { description: Reset OTP sent. }
  /api/v1/students/password-reset/verify-otp:
    post:
      tags: [Student Auth]
      summary: Verify student password reset OTP
      requestBody:
        $ref: "#/components/requestBodies/EmailOtp"
      responses:
        "200": { description: Reset token returned. }
  /api/v1/students/password-reset/set-new:
    post:
      tags: [Student Auth]
      summary: Set student password after reset verification
      requestBody:
        $ref: "#/components/requestBodies/NewPassword"
      responses:
        "200": { description: Password updated. }

  /api/v1/students/profile:
    get:
      tags: [Student]
      summary: Get current student profile
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Student profile. }
    patch:
      tags: [Student]
      summary: Update current student profile
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/AnyObject"
      responses:
        "200": { description: Profile updated. }
  /api/v1/students/profile/{studentId}:
    delete:
      tags: [Student]
      summary: Deactivate a student profile
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/studentId"
      responses:
        "200": { description: Student deactivated. }
  /api/v1/students/students/update-push-token:
    patch:
      tags: [Student]
      summary: Update current student's push notification token
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/PushToken"
      responses:
        "200": { description: Push token updated. }
  /api/v1/students/students/notification/test:
    post:
      tags: [Student]
      summary: Send a test push notification to a student
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/TestNotification"
      responses:
        "200": { description: Notification sent. }
  /api/v1/students/students/notification/count:
    get:
      tags: [Student]
      summary: Get unread notification count
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Notification count. }
  /api/v1/students/students/notification/history:
    get:
      tags: [Student]
      summary: Get notification history
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/cursorCreatedAt"
        - $ref: "#/components/parameters/cursorId"
        - $ref: "#/components/parameters/limit"
      responses:
        "200": { description: Notification page. }
  /api/v1/students/select-agency:
    post:
      tags: [Student]
      summary: Select an agency for the current student
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/AgencySelection"
      responses:
        "200": { description: Agency selected. }
  /api/v1/students/uploads/sas:
    post:
      tags: [Student]
      summary: Generate Azure Blob SAS upload details
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/SasRequest"
      responses:
        "200": { description: SAS upload details. }
  /api/v1/students/uploads/confirm:
    post:
      tags: [Student]
      summary: Confirm a student upload
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/StudentUploadConfirm"
      responses:
        "200": { description: Upload confirmed. }
  /api/v1/students/courses:
    get:
      tags: [Student]
      summary: List courses for the student's selected agency
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Course list. }
  /api/v1/students/courses/search:
    get:
      tags: [Student]
      summary: Search courses by name
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/q"
      responses:
        "200": { description: Matching courses. }
  /api/v1/students/courses/select/{courseId}:
    patch:
      tags: [Student]
      summary: Select a course
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/courseId"
      responses:
        "200": { description: Course selected. }
  /api/v1/students/universities/query/{agencyId}/search:
    get:
      tags: [Student]
      summary: Search universities by agency
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/agencyId"
        - $ref: "#/components/parameters/q"
      responses:
        "200": { description: Matching universities. }
  /api/v1/students/scholarships/query/{agencyId}/search:
    get:
      tags: [Student]
      summary: Search scholarships by agency
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/agencyId"
        - $ref: "#/components/parameters/q"
      responses:
        "200": { description: Matching scholarships. }
  /api/v1/students/events/registration/{eventId}:
    post:
      tags: [Student]
      summary: Register for an event
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/eventId"
      requestBody:
        $ref: "#/components/requestBodies/EventRegistration"
      responses:
        "200": { description: Registration completed. }
  /api/v1/students/mentors/{agencyId}:
    get:
      tags: [Student]
      summary: List mentors for an agency
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/agencyId"
      responses:
        "200": { description: Mentor list. }
  /api/v1/students/mentors/connect/{mentorId}:
    post:
      tags: [Student]
      summary: Request connection with a mentor
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/mentorId"
      responses:
        "200": { description: Mentor connection requested. }
  /api/v1/students/documents/status:
    get:
      tags: [Student]
      summary: Get document completion status
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/stage"
      responses:
        "200": { description: Document status. }
  /api/v1/students/documents:
    get:
      tags: [Student]
      summary: Get required documents for current student
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/stage"
      responses:
        "200": { description: Student document list. }

  /api/v1/mentor/login:
    post:
      tags: [Mentor Auth]
      summary: Mentor login
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200": { description: Login token and mentor data. }
  /api/v1/mentor/password-reset/send-otp:
    post:
      tags: [Mentor Auth]
      summary: Send mentor password reset OTP
      requestBody:
        $ref: "#/components/requestBodies/Email"
      responses:
        "200": { description: Reset OTP sent. }
  /api/v1/mentor/password-reset/verify-otp:
    post:
      tags: [Mentor Auth]
      summary: Verify mentor password reset OTP
      requestBody:
        $ref: "#/components/requestBodies/EmailOtp"
