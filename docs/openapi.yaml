        "200": { description: Appointment cancelled. }
  /api/v1/agent/appointments/{appointmentId}/complete:
    patch:
      tags: [Agent]
      summary: Mark an agent appointment complete
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/appointmentId"
      responses:
        "200": { description: Appointment completed. }
  /api/v1/agent/appointments/search:
    get:
      tags: [Agent]
      summary: Search agent appointments by student name
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/name"
      responses:
        "200": { description: Matching appointments. }
  /api/v1/agent/agent-list:
