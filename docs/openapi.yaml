      tags: [Agent]
      summary: Update current agent profile
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/AnyObject"
      responses:
        "200": { description: Profile updated. }
  /api/v1/agent/students:
    get:
      tags: [Agent]
      summary: List students assigned to the current agent
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Student list. }
  /api/v1/agent/documents/required:
    post:
      tags: [Agent]
      summary: Create a required document definition
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/RequiredDocument"
      responses:
        "201": { description: Required document created. }
    get:
      tags: [Agent]
      summary: List required document definitions
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/stage"
      responses:
        "200": { description: Required document list. }
  /api/v1/agent/documents/required/{id}:
    patch:
      tags: [Agent]
      summary: Update a required document definition
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        $ref: "#/components/requestBodies/RequiredDocumentUpdate"
      responses:
        "200": { description: Required document updated. }
    delete:
      tags: [Agent]
      summary: Delete a required document definition
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200": { description: Required document deleted. }
  /api/v1/agent/documents/student/{studentId}:
