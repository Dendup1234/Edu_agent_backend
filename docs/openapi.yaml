        "200": { description: Fraud result saved. }

  /api/v1/admin/login:
    post:
      tags: [Admin Auth]
      summary: Admin login
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200": { description: Login token and admin data. }
  /api/v1/admin/password-reset/send-otp:
